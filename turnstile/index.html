<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />

  <meta name="color-scheme" content="light" />

  <title>Security Verification</title>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;

      overflow: hidden;
      background: transparent;
    }

    body {
      position: relative;
    }

    /*
     * Invisible Turnstile用のコンテナ。
     *
     * display:none は使用せず、
     * DOM上には存在させたまま最小サイズにする。
     */
    #turnstile-container {
      position: absolute;

      top: 0;
      left: 0;

      width: 1px;
      height: 1px;

      overflow: hidden;
    }
  </style>

  <script>
    (function () {
      "use strict";

      const params =
        new URLSearchParams(
          window.location.search
        );

      /*
       * React Native側から
       *
       * ?sitekey=xxxx
       *
       * の形式で受け取る。
       */
      const siteKey =
        params.get("sitekey");

      let widgetId = null;

      /**
       * React Native WebViewへ
       * メッセージを送信する。
       *
       * Safariから直接開いた場合は
       * ReactNativeWebViewが存在しないため、
       * 何もしない。
       */
      function sendToNative(payload) {
        try {
          const bridge =
            window.ReactNativeWebView;

          if (
            bridge &&
            typeof bridge.postMessage === "function"
          ) {
            bridge.postMessage(
              JSON.stringify(payload)
            );
          }
        } catch (_) {
          // Native Bridgeの失敗で
          // Turnstile処理を停止させない。
        }
      }

      /**
       * Native側へエラー通知。
       */
      function sendError(
        code,
        message
      ) {
        sendToNative({
          type: "error",

          code:
            code ||
            "unknown",

          message:
            message ||
            "Security verification failed.",
        });
      }

      /**
       * Turnstile API読み込み完了時に
       * Cloudflareから呼ばれる。
       */
      window.onTurnstileLoad =
        function () {
          sendToNative({
            type: "ready",

            hostname:
              window.location.hostname,

            origin:
              window.location.origin,
          });

          /*
           * Site Key確認
           */
          if (!siteKey) {
            sendError(
              "sitekey_missing",
              "Turnstile site key is missing."
            );

            return;
          }

          /*
           * Turnstile API確認
           */
          if (
            !window.turnstile ||
            typeof window.turnstile.render !==
              "function"
          ) {
            sendError(
              "turnstile_api_unavailable",
              "Turnstile API is unavailable."
            );

            return;
          }

          try {
            /*
             * Cloudflare Dashboard側で
             * Widget Mode = Invisible
             *
             * にしていることを前提とする。
             *
             * Invisible Widgetでは
             * 可視UIは表示されない。
             */
            widgetId =
              window.turnstile.render(
                "#turnstile-container",
                {
                  sitekey:
                    siteKey,

                  /*
                   * render()と同時に
                   * challengeを開始する。
                   */
                  execution:
                    "render",

                  /*
                   * 一時的な失敗は
                   * Cloudflare側で自動再試行。
                   */
                  retry:
                    "auto",

                  "retry-interval":
                    8000,

                  /*
                   * Token期限切れ時は
                   * 自動的に新しいchallengeを実行。
                   */
                  "refresh-expired":
                    "auto",

                  /*
                   * Invisibleモードでは
                   * 基本的に表示文字はないが、
                   * accessibility等も含め
                   * 英語固定にしておく。
                   */
                  language:
                    "en",

                  /*
                   * 成功時
                   */
                  callback:
                    function (
                      token
                    ) {
                      if (
                        !token ||
                        typeof token !==
                          "string"
                      ) {
                        sendError(
                          "empty_token",
                          "Turnstile returned an empty token."
                        );

                        return;
                      }

                      sendToNative({
                        type:
                          "token",

                        token:
                          token,
                      });
                    },

                  /*
                   * Challenge失敗時
                   */
                  "error-callback":
                    function (
                      errorCode
                    ) {
                      const code =
                        String(
                          errorCode ||
                            "unknown"
                        );

                      sendError(
                        code,
                        "Security verification failed."
                      );

                      return true;
                    },

                  /*
                   * Token期限切れ時
                   */
                  "expired-callback":
                    function () {
                      sendToNative({
                        type:
                          "expired",
                      });
                    },

                  /*
                   * Browser非対応時
                   */
                  "unsupported-callback":
                    function () {
                      sendError(
                        "unsupported",
                        "Turnstile is not supported in this browser."
                      );
                    },
                }
              );

            /*
             * render()自体が成功したことを
             * Native側へ通知。
             */
            sendToNative({
              type:
                "rendered",

              widgetId:
                widgetId != null
                  ? String(
                      widgetId
                    )
                  : null,
            });
          } catch (error) {
            const message =
              error instanceof Error
                ? error.message
                : String(
                    error ||
                      "unknown"
                  );

            sendError(
              "render_failed",
              message
            );
          }
        };

      /**
       * HTML自体のJavaScriptエラー。
       */
      window.addEventListener(
        "error",
        function (event) {
          sendError(
            "javascript_error",
            event.message ||
              "Unexpected JavaScript error."
          );
        }
      );

      /**
       * Promiseの未処理エラー。
       */
      window.addEventListener(
        "unhandledrejection",
        function (event) {
          let reason =
            "unknown";

          try {
            reason =
              event.reason instanceof
              Error
                ? event.reason.message
                : String(
                    event.reason ||
                      "unknown"
                  );
          } catch (_) {
            reason =
              "unknown";
          }

          sendError(
            "promise_rejection",
            reason
          );
        }
      );

      /**
       * GitHub Pages自体が
       * 正常にロードされたことを通知。
       */
      document.addEventListener(
        "DOMContentLoaded",
        function () {
          sendToNative({
            type:
              "page_loaded",

            hostname:
              window.location.hostname,

            origin:
              window.location.origin,
          });
        }
      );
    })();
  </script>

  <!--
    Explicit Renderingを使用。

    onload callbackによって、
    Turnstile APIが完全に利用可能になってから
    turnstile.render() を実行する。
  -->
  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoad"
    defer
  ></script>
</head>

<body>
  <div
    id="turnstile-container"
    aria-hidden="true"
  ></div>
</body>
</html>
