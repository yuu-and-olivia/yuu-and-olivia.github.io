<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />

  <meta name="color-scheme" content="light" />

  <title>Security Check</title>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    #root {
      width: 100%;
      min-height: 70px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    #turnstile-container {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    #fallback-message {
      display: none;

      width: 100%;
      padding: 12px 16px;

      color: #666;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }
  </style>

  <script>
    (function () {
      "use strict";

      const params = new URLSearchParams(
        window.location.search
      );

      const siteKey = params.get("sitekey");

      function sendToNative(payload) {
        try {
          const bridge =
            window.ReactNativeWebView;

          if (
            bridge &&
            typeof bridge.postMessage === "function"
          ) {
            bridge.postMessage(
              JSON.stringify(payload)
            );
          }
        } catch (_) {
          // Do not interrupt Turnstile when
          // React Native bridge communication fails.
        }
      }

      function showFallback(message) {
        const element =
          document.getElementById(
            "fallback-message"
          );

        if (!element) {
          return;
        }

        element.textContent = message;
        element.style.display = "block";
      }

      function sendError(
        code,
        message
      ) {
        sendToNative({
          type: "error",
          code: code || "unknown",
          message:
            message ||
            "Security verification failed.",
        });
      }

      window.onTurnstileLoad =
        function () {
          sendToNative({
            type: "ready",
            hostname:
              window.location.hostname,
            origin:
              window.location.origin,
          });

          if (!siteKey) {
            const message =
              "Security verification configuration is missing.";

            showFallback(message);

            sendError(
              "sitekey_missing",
              message
            );

            return;
          }

          if (
            !window.turnstile ||
            typeof window.turnstile.render !==
              "function"
          ) {
            const message =
              "Security verification service could not be loaded.";

            showFallback(message);

            sendError(
              "turnstile_api_unavailable",
              message
            );

            return;
          }

          try {
            window.turnstile.render(
              "#turnstile-container",
              {
                sitekey: siteKey,

                theme: "light",

                /*
                 * IMPORTANT:
                 *
                 * Force English to avoid Japanese/CJK
                 * font rendering problems inside
                 * iOS WKWebView / Simulator.
                 *
                 * Turnstile's internal iframe cannot
                 * be styled from this parent page.
                 */
                language: "en",

                size: "flexible",

                /*
                 * Do not show the widget unless
                 * Cloudflare requires interaction.
                 */
                appearance:
                  "interaction-only",

                execution: "render",

                retry: "auto",

                "retry-interval": 8000,

                "refresh-expired": "auto",

                "refresh-timeout": "auto",

                callback:
                  function (token) {
                    if (
                      !token ||
                      typeof token !==
                        "string"
                    ) {
                      sendError(
                        "empty_token",
                        "Security verification token could not be obtained."
                      );

                      return;
                    }

                    sendToNative({
                      type: "token",
                      token: token,
                    });
                  },

                "error-callback":
                  function (
                    errorCode
                  ) {
                    const code =
                      String(
                        errorCode ||
                          "unknown"
                      );

                    sendError(
                      code,
                      "Security verification failed."
                    );

                    return true;
                  },

                "expired-callback":
                  function () {
                    sendToNative({
                      type: "expired",
                    });
                  },

                "timeout-callback":
                  function () {
                    sendToNative({
                      type: "timeout",
                    });
                  },

                "unsupported-callback":
                  function () {
                    const message =
                      "Security verification is not supported on this device.";

                    showFallback(
                      message
                    );

                    sendError(
                      "unsupported",
                      message
                    );
                  },
              }
            );
          } catch (error) {
            const errorMessage =
              error instanceof Error
                ? error.message
                : String(
                    error ||
                      "unknown"
                  );

            showFallback(
              "Security verification could not be started."
            );

            sendError(
              "render_failed",
              errorMessage
            );
          }
        };

      window.addEventListener(
        "error",
        function (event) {
          sendError(
            "javascript_error",
            event.message ||
              "An unexpected error occurred."
          );
        }
      );

      window.addEventListener(
        "unhandledrejection",
        function (event) {
          let reason =
            "unknown";

          try {
            reason =
              event.reason instanceof
              Error
                ? event.reason.message
                : String(
                    event.reason ||
                      "unknown"
                  );
          } catch (_) {
            reason = "unknown";
          }

          sendError(
            "promise_rejection",
            reason
          );
        }
      );

      document.addEventListener(
        "DOMContentLoaded",
        function () {
          sendToNative({
            type: "page_loaded",
            hostname:
              window.location.hostname,
            origin:
              window.location.origin,
          });
        }
      );
    })();
  </script>

  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoad"
    defer
  ></script>
</head>

<body>
  <main id="root">
    <div
      id="turnstile-container"
      aria-label="Security verification"
    ></div>

    <div
      id="fallback-message"
      role="alert"
      aria-live="polite"
    ></div>
  </main>
</body>
</html>
